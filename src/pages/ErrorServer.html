<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Erro interno do servidor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/erro.css">
</head>
<body class="error-page">
  <div class="container">
    <main class="error-card card">

      <p class="error-brand">
        <span class="eyebrow-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="m20.3 20.3 1.7 1.7"/></svg>
        </span>
        Controle interno
      </p>

      <p class="error-code" aria-hidden="true">500</p>

      <div class="error-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
      </div>

      <h1>Erro interno do servidor</h1>
      <p class="message">Algo deu errado do nosso lado. Já estamos cientes do problema. Tente novamente em alguns instantes.</p>

      <div class="error-actions">
        <button class="btn btn-primary" type="button" onclick="location.reload()">Tentar novamente</button>
        <a class="btn btn-secondary" href="index.html">Voltar ao início</a>
      </div>

      <p class="error-ref">Se o erro persistir, entre em contato com o time de suporte.</p>

    </main>
  </div>
</body>
</html>
