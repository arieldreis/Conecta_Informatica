<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Página não encontrada no sistema da Conecta Informática.">
    <title>404 - Página não encontrada | Conecta Informática</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <main class="state-page">
        <a class="brand state-brand" href="index.html#inicio" aria-label="Conecta Informática - início">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span class="brand-copy"><strong>conecta</strong><small>INFORMÁTICA</small></span>
        </a>

        <section class="state-card state-not-found" aria-labelledby="state-title">
            <div class="state-illustration" aria-hidden="true"><span>⌕</span></div>
            <p class="state-code">ERRO 404</p>
            <h1 id="state-title">Página não encontrada</h1>
            <p class="state-message">Não encontramos a página ou o produto que você tentou acessar. Confira o endereço ou volte ao catálogo.</p>
            <a class="button button-primary state-button" href="index.html#produtos">Voltar ao catálogo <span aria-hidden="true">→</span></a>
            <a class="state-secondary-link" href="index.html#inicio">Ir para o início</a>
        </section>

        <footer class="state-footer">Conecta Informática <span aria-hidden="true">·</span> Cadastro e controle de produtos</footer>
    </main>
</body>
</html>
