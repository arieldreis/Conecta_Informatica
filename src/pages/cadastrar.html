<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/cadastro.css">
</head>
<body>
  <div class="container">

    <header class="hero">
      <div class="hero-text">
        <p class="eyebrow">
          <span class="eyebrow-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="m20.3 20.3 1.7 1.7"/></svg>
          </span>
          Controle interno
        </p>
        <h1>Cadastro de Produtos</h1>
        <p class="subtitle">Gerencie o catálogo, acompanhe o estoque e mantenha os dados do time sempre organizados.</p>
      </div>
    </header>

    <main>
      <section class="page-head">
        <h2>Cadastrar produto</h2>
        <p class="muted">Preencha os dados obrigatórios para incluir um item no catálogo.</p>
      </section>

      <form class="card form-card" action="#" method="post">
        <div class="form-grid">

          <div class="field">
            <label for="nome">Nome do produto *</label>
            <input id="nome" name="nome" type="text" required maxlength="120" autocomplete="off">
          </div>

          <div class="field">
            <label for="sku">Código / SKU *</label>
            <input id="sku" name="sku" type="text" required maxlength="30" autocomplete="off">
          </div>

          <div class="field">
            <label for="categoria">Categoria *</label>
            <select id="categoria" name="categoria" required>
              <option value="" selected disabled></option>
              <option>Eletrônicos</option>
              <option>Escritório</option>
              <option>Alimentos</option>
              <option>Limpeza</option>
              <option>Outros</option>
            </select>
          </div>

          <div class="field">
            <label for="preco">Preço (R$) *</label>
            <input id="preco" name="preco" type="number" inputmode="decimal" min="0" step="0.01" required>
          </div>

          <div class="field">
            <label for="estoque">Quantidade em estoque *</label>
            <input id="estoque" name="estoque" type="number" inputmode="numeric" min="0" step="1" required>
          </div>

          <div class="field col-full">
            <label for="descricao">Descrição *</label>
            <textarea id="descricao" name="descricao" required maxlength="500"></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button class="btn btn-secondary" type="reset">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            Limpar formulário
          </button>
          <button class="btn btn-primary" type="submit">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
            Cadastrar produto
          </button>
        </div>
      </form>
    </main>

  </div>
</body>
</html>
