<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Confirmação de operação realizada com sucesso na Conecta Informática.">
    <title>Operação concluída | Conecta Informática</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <main class="state-page">
        <a class="brand state-brand" href="index.html#inicio" aria-label="Conecta Informática - início">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span class="brand-copy"><strong>conecta</strong><small>INFORMÁTICA</small></span>
        </a>

        <section class="state-card state-success" aria-labelledby="state-title" aria-live="polite">
            <div class="state-illustration" aria-hidden="true"><span>✓</span></div>
            <p class="state-code">TUDO CERTO</p>
            <h1 id="state-title">Operação concluída!</h1>
            <p class="state-message">Sua solicitação foi processada com sucesso. As informações do produto foram atualizadas.</p>
            <a class="button button-primary state-button" href="http://localhost:3000/pages/Home#inicio">Voltar ao catálogo <span aria-hidden="true">→</span></a>
            <a class="state-secondary-link" href="http://localhost:3000/pages/Home#novo-produto">Cadastrar outro produto</a>
        </section>

        <footer class="state-footer">Conecta Informática <span aria-hidden="true">·</span> Cadastro e controle de produtos</footer>
    </main>
</body>
</html>
